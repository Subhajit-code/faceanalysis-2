services:
  face-engine:
    build: ./face-engine
    ports:
      - "8000:8000"
    restart: unless-stopped

  api:
    build: ./server
    env_file: ./server/.env
    environment:
      FACE_ENGINE_URL: http://face-engine:8000
      # DATABASE_URL (a Postgres connection string, e.g. from Neon/Supabase)
      # comes from server/.env — this project no longer uses a local SQLite
      # file or a Docker volume, so no local Postgres container is needed here.
    ports:
      - "4000:4000"
    depends_on:
      face-engine:
        condition: service_started
    restart: unless-stopped
